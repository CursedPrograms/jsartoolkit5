<html>
<body>
<style>
video {
	transform: scale(-1, 1);
}

canvas {
	transform: scale(-1, 1);
}
</style>

<script async src="../build/artoolkit.debug.js"></script>
<script src="../js/artoolkit.api.js"></script>

<script>
var video = document.createElement('video');
video.playsInline = true;
video.autoplay = true;

document.body.appendChild(video);

var tw = 1280 / 2;
var th = 720 / 2;

// navigator.getUserMedia and the "mandatory" constraints were removed from browsers;
// navigator.mediaDevices is the current API (it needs https:// or localhost)
var constraints = {
	audio: false,
	video: {
		width: { max: tw },
		height: { max: th }
	}
};

if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
	navigator.mediaDevices.getUserMedia(constraints).then(success, errorCallback);
} else {
	errorCallback(window.isSecureContext === false
		? 'camera access needs https:// or localhost'
		: 'navigator.mediaDevices.getUserMedia is not supported');
}

function errorCallback(e) {
	console.log("Can't access user media", e);
}


function success(stream) {
	console.log('success', stream);
	video.srcObject = stream;
	video.onclick = function() { video.play(); };
	video.play();

	var cameraParam = new ARCameraParam('Data/camera_para.dat');
	cameraParam.onload = function() {

		var arController;

		var interval = setInterval(function() {
			if (!video.videoWidth)	return;

			if (!arController) {
				arController = new ARController(video, cameraParam);
				arController.debugSetup();
			}

			arController.process();
		}, 16);

	};
}
</script>

</body>
</html>
